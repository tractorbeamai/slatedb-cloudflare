[package]
name = "slatedb-cloudflare-container"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
axum = "0.8.4"
bytes = "1.10.1"
futures = "0.3.31"
object_store = { version = "0.14.1", features = ["aws"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
slatedb = "0.15.0"
slatedb-common = "0.15.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
